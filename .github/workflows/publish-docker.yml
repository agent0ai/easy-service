name: Publish Docker image

on:
  push:
    tags:
      - "**"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Docker tag
        env:
          IMAGE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Git tag is not a valid Docker tag; use 1-128 ASCII letters, digits, dots, underscores, or dashes, starting with a letter, digit, or underscore." >&2
            exit 1
          fi

      - name: Check out tagged revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_ORG }}
          password: ${{ secrets.DOCKERHUB_OAT_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish tagged image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: agent0ai/easy-service:${{ github.ref_name }}
