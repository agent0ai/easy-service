services:
  easy-service:
    build: .
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      GIT_URL: https://github.com/example/stateless-api.git
      GIT_TOKEN: ${GIT_TOKEN:-}
      RUNTIME_IMAGE: node:22-bookworm-slim
      SETUP_COMMAND: npm ci
      RUN_COMMAND: node server.js
    volumes:
      - easy-service-data:/data
    security_opt:
      - seccomp=unconfined
volumes:
  easy-service-data:
